# Release (ADR 0029). Runs for a version tag (v1.2.3) or by hand.
#
# It always verifies and builds. It publishes the image to GHCR only when the repository
# variable PUBLISH_IMAGE is "true" and the run is for a version tag; until someone sets
# that variable, nothing is pushed anywhere. Actions are pinned by commit SHA.
#
# This workflow has not run yet: the repository has no release. Read docs/release.md
# before the first one.
name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Fetch and verify the vendor API contracts
        run: npm run api:fetch-specs
      - run: npm run check
      - run: npm run api:reconcile
      - run: npm audit --audit-level=low
      - run: npm audit signatures
      - name: The tag, the packages and the service state the same version
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run release:verify -- --version "${GITHUB_REF_NAME#v}"
      - name: Static release checks
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run release:verify
      - run: npm run sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: release/
          retention-days: 90

  containers:
    # The Compose examples and the maintenance drill with the image as released, natively
    # on both architectures.
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: npm run test:containers

  publish-image:
    # Off unless the repository variable PUBLISH_IMAGE is "true". One image per
    # architecture, built on that architecture, with BuildKit's provenance and SBOM
    # attestations attached.
    needs: [verify, containers]
    if: vars.PUBLISH_IMAGE == 'true' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sign in to GHCR with the workflow token
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Build and push the image for this architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/unifi-local-mcp"
          docker buildx create --use --name release
          docker buildx build \
            --platform "linux/${ARCH}" \
            --build-arg "VERSION=${version}" \
            --provenance=mode=max --sbom=true \
            --tag "${image}:${version}-${ARCH}" \
            --push .

  publish-manifest:
    # One name for both architectures.
    needs: publish-image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Sign in to GHCR with the workflow token
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Join the two images under the version tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/unifi-local-mcp"
          docker buildx imagetools create --tag "${image}:${version}" \
            "${image}:${version}-amd64" "${image}:${version}-arm64"
          docker buildx imagetools inspect "${image}:${version}"
